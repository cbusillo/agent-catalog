name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    needs: inspect-python
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful macOS inspection
        run: test "${{ needs.inspect-python.result }}" = success
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --python 3.15
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run pytest

  inspect-python:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --python 3.15
      - run: command -v shellcheck || brew install shellcheck
      - name: Inspect a clean Python project with the pinned PyCharm
        env:
          INSPECT_PYTHON_HOME: ${{ runner.temp }}/inspect-python
        run: |
          git init --quiet "$RUNNER_TEMP/clean-project"
          cd "$RUNNER_TEMP/clean-project"
          echo '.venv/' >> .git/info/exclude
          uv init --bare --python 3.15
          uv sync
          printf 'def twice(number: int) -> int:\n    return number + number\n' > example.py
          git add example.py pyproject.toml uv.lock
          "$GITHUB_WORKSPACE/.venv/bin/inspect-python"
