[project]
name = "agent-catalog"
version = "0.1.0"
requires-python = ">=3.15"

[project.scripts]
inspect-python = "python_inspection.inspection:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff", "pyright", "pytest"]

[tool.ruff]
line-length = 133
target-version = "py315"
extend-exclude = ["src/python_inspection/proofs"]

[tool.ruff.lint]
select = [
    "E", "F",
    "ANN", "UP", "B", "I", "G", "BLE",
    "FURB", "SIM", "C4", "PERF",
    "DTZ",
    "S",
    "PTH",
    "T20", "ERA",
    "C90",
    "RUF",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.15"
exclude = ["src/python_inspection/proofs", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
module-name = "python_inspection"
